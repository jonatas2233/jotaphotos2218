<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administração - Jota Photos</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header_section">
        <div class="container-fluid">
            <nav class="navbar navbar-expand-lg custom_nav-container d-block">
                <div class="main_nav_menu">
                    <div class="fk_width">
                        <div class="custom_menu-btn">
                            <button onclick="openNav()">
                                <span class="s-1"> </span>
                                <span class="s-2"> </span>
                                <span class="s-3"> </span>
                            </button>
                        </div>
                        <div id="myNav" class="overlay">
                            <div class="overlay-content">
                                <a href="index.html">Página Inicial <span class="sr-only">(current)</span></a>
                                <a href="about.html">Sobre</a>
                                <a href="gallery.html">Galeria</a>
                            </div>
                        </div>
                    </div>
                    <a class="navbar-brand" href="index.html">
                        <span>Jota Photos</span>
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Seção Clientes -->
    <section class="clientes-section">
        <div class="container">
            <h2>Clientes</h2>
            <div class="row">
                <!-- Exemplo de Cliente 1 -->
                <div class="col-md-4">
                    <div class="cliente-item">
                        <img src="images/blog1.jpg" alt="Cliente 1" class="cliente-img">
                        <div class="cliente-info">
                            <h3>Cliente VANESSA</h3>
                            <p>Data: 05/05/2025<br>Descrição: 15 ANOS <br>Valor: R$ 500,00</p>
                        </div>
                        <a href="cliente1.html" class="cliente-link"></a>
                    </div>
                </div>
                <!-- Exemplo de Cliente 2 -->
                <div class="col-md-4">
                    <div class="cliente-item">
                        <img src="images/blog2.jpg" alt="Cliente 2" class="cliente-img">
                        <div class="cliente-info">
                            <h3>Cliente ANA CAROLINA</h3>
                            <p>Data: 02/04/2025<br>Descrição: FORMATURA<br>Valor: R$ 700,00</p>
                        </div>
                        <a href="cliente2.html" class="cliente-link"></a>
                    </div>
                </div>
                <!-- Adicione mais clientes conforme necessário -->
            </div>
        </div>
    </section>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Jota Photos - Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/custom.js"></script>
</body>
</html>
